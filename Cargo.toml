[workspace]
resolver = "2"
members = ["crates/block-device", "crates/partition-manager", "crates/filesystem-detection", "crates/voluma-ffi", "crates/fs-core", "crates/fs-fat"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.80"

[workspace.dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
